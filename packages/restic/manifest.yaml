id: restic
name: restic
description: Fast, secure backup program with deduplication, encryption, and pruning
version: "0.20.0"
kind: cli
tags: [backup]
homepage: https://restic.net/
license: BSD-2-Clause
sources:
    - url: "https://github.com/restic/restic/releases/download/v0.20.0/restic_0.20.0_linux_amd64.bz2"
      file: "restic-{version}.bz2"
      sha256: "0ccd9fa7885074a24603b051e01bf9bd8b5e45d6a1791e9d9887e9e9372107f7"
      size: 12639573
      update:
        type: github
        repo: restic/restic
        asset: "^restic_{version}_linux_amd64\\.bz2$"
        tag-pattern: "^v([0-9.]+)$"
prepare:
    # Upstream ships the bare binary, bzip2-compressed, not an archive.
    - "bunzip2 -c restic-{version}.bz2 > {pkg}/restic"
    - "chmod +x {pkg}/restic"
bin:
    - {name: restic, path: "{app}/restic"}
