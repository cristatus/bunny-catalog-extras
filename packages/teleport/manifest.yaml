id: teleport
name: Teleport
description: tsh and tctl, the client tools for Teleport-protected SSH, Kubernetes, and database infrastructure
version: "18.10.7"
kind: cli
tags: [remote-access]
homepage: https://goteleport.com/
license: Apache-2.0
sources:
    # Same pool-.deb pinning as teleport-connect: no portable tarball ships a
    # checksum, but the apt Packages index does. The deb bundles the full
    # server (teleport), tbot, and teleport-update alongside the client
    # tools, so prepare extracts only tsh/tctl instead of the whole 790MB
    # unpacked tree.
    - url: "https://apt.releases.teleport.dev/ubuntu/pool/stable/v18/t/teleport/teleport_{version}_amd64.deb"
      file: "teleport-{version}.deb"
      sha256: "790d2cf02e19dc01e6957bf698008681b64b5f6858e5dc32cdd25a2ad0a1a24a"
      size: 216511700
      update:
        type: debian
        root: https://apt.releases.teleport.dev/ubuntu
        dist: jammy
        component: stable/v18
        package-name: teleport
prepare:
    - "ar x teleport-{version}.deb"
    - "tar xf data.tar.gz ./opt/teleport/system/bin/tsh ./opt/teleport/system/bin/tctl"
    - "mv opt/teleport/system/bin/tsh opt/teleport/system/bin/tctl {pkg}/"
bin:
    - {name: tsh, path: "{app}/tsh"}
    - {name: tctl, path: "{app}/tctl"}
