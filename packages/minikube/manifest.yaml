id: minikube
name: minikube
description: Run a single-node Kubernetes cluster locally on a container or VM driver
version: "1.39.0"
kind: cli
tags: [kubernetes]
homepage: https://minikube.sigs.k8s.io/
license: Apache-2.0
sources:
    - url: "https://github.com/kubernetes/minikube/releases/download/v{version}/minikube-linux-amd64"
      file: "minikube-{version}"
      sha256: "b738496da01be06bbaf80c688f57ce25acd3849fbb518155f3a88e03ef555aa4"
      size: 142610232
      update:
        type: github
        repo: kubernetes/minikube
        asset: "^minikube-linux-amd64$"
        tag-pattern: "^v([0-9.]+)$"
prepare:
    - "mv minikube-{version} {pkg}/minikube"
    - "chmod +x {pkg}/minikube"
bin:
    - {name: minikube, path: "{app}/minikube"}
