id: kind
name: kind
description: Run local Kubernetes clusters using Docker or Podman containers as nodes
version: "0.33.0"
kind: cli
tags: [kubernetes]
homepage: https://kind.sigs.k8s.io/
license: Apache-2.0
sources:
    - url: "https://github.com/kubernetes-sigs/kind/releases/download/v{version}/kind-linux-amd64"
      file: "kind-{version}"
      sha256: "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d"
      size: 10530942
      update:
        type: github
        repo: kubernetes-sigs/kind
        asset: "^kind-linux-amd64$"
        tag-pattern: "^v([0-9.]+)$"
prepare:
    - "mv kind-{version} {pkg}/kind"
    - "chmod +x {pkg}/kind"
bin:
    - {name: kind, path: "{app}/kind"}
